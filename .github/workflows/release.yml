name: Release Foundation

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Build runtime pack
        run: |
          npm ci
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "v${PACKAGE_VERSION}" = "${GITHUB_REF_NAME}"
          npm run verify

      - name: Archive runtime pack
        run: |
          cd build
          zip -r "../hmp-foundation-${GITHUB_REF_NAME}.zip" hmp-foundation

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "hmp-foundation-${GITHUB_REF_NAME}.zip" --generate-notes
