<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>HMP UI</title>
  <style>
    :root { color-scheme: dark; --ink:#e9e2d2; --muted:#aaa28f; --panel:rgba(18,20,25,.97); --line:#7d6b49; --gold:#c8a65b; --blue:#6ea6c9; --green:#6fac82; --amber:#d2a552; --red:#ca6f67; }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; background:transparent; color:var(--ink); font-family:Georgia,"Times New Roman",serif; pointer-events:none; }
    button,input,textarea,select { font:inherit; }
    #toasts { position:fixed; top:24px; right:24px; width:min(380px,calc(100vw - 48px)); display:grid; gap:10px; z-index:20; }
    .toast { pointer-events:none; position:relative; padding:14px 16px 14px 18px; border:1px solid rgba(200,166,91,.48); border-radius:7px; background:linear-gradient(135deg,rgba(28,31,38,.98),rgba(15,17,22,.96)); box-shadow:0 14px 38px rgba(0,0,0,.38); animation:arrive .2s ease-out; overflow:hidden; }
    .toast::before { content:""; position:absolute; inset:0 auto 0 0; width:4px; background:var(--blue); }
    .toast.success::before { background:var(--green); }.toast.warning::before{background:var(--amber)}.toast.error::before{background:var(--red)}
    .toast strong { display:block; margin-bottom:4px; color:#f3ddb0; letter-spacing:.04em; }.toast p{margin:0;color:var(--ink);line-height:1.38}
    .toast.leave { animation:leave .18s ease-in forwards; }
    #overlay { position:fixed; inset:0; display:none; place-items:center; padding:28px; background:radial-gradient(circle at center,rgba(9,10,14,.26),rgba(4,5,8,.68)); z-index:10; pointer-events:auto; }
    #overlay.open { display:grid; }
    .panel { width:min(560px,calc(100vw - 40px)); max-height:min(760px,calc(100vh - 48px)); overflow:auto; padding:25px; border:1px solid var(--line); border-radius:8px; background:linear-gradient(145deg,var(--panel),rgba(10,12,16,.98)); box-shadow:0 24px 80px rgba(0,0,0,.58),inset 0 0 45px rgba(200,166,91,.025); }
    .eyebrow { color:var(--gold); text-transform:uppercase; letter-spacing:.18em; font-size:11px; margin-bottom:7px; }
    h1 { margin:0; color:#f3ddb0; font-size:25px; font-weight:500; line-height:1.2; }
    .content { margin:12px 0 0; color:var(--muted); line-height:1.55; white-space:pre-wrap; }
    .actions { display:flex; justify-content:flex-end; gap:10px; margin-top:22px; }
    button { cursor:pointer; min-height:38px; padding:8px 15px; color:var(--ink); border:1px solid #5c5548; border-radius:5px; background:#22252c; }
    button:hover:not(:disabled),button:focus-visible { border-color:var(--gold); outline:none; background:#2b2d33; }
    button.primary { color:#17130c; border-color:var(--gold); background:var(--gold); font-weight:bold; }
    button.danger { border-color:var(--red); color:#f0b2ad; }
    button:disabled { cursor:not-allowed; opacity:.45; }
    .fields { display:grid; gap:15px; margin-top:18px; }
    label.field { display:grid; gap:7px; color:#e2d7bf; }
    .hint { color:var(--muted); font-size:13px; line-height:1.35; }
    input,textarea,select { width:100%; color:var(--ink); border:1px solid #504a40; border-radius:5px; background:#12151a; padding:10px 11px; outline:none; }
    input:focus,textarea:focus,select:focus { border-color:var(--gold); box-shadow:0 0 0 2px rgba(200,166,91,.12); }
    textarea { min-height:112px; resize:vertical; }
    .check { display:flex!important; grid-template-columns:none!important; align-items:center; gap:10px!important; }.check input{width:auto}
    .options { display:grid; gap:9px; margin-top:18px; }
    .option { width:100%; text-align:left; padding:13px 14px; display:grid; gap:4px; }
    .option.has-icon { grid-template-columns:48px minmax(0,1fr); align-items:center; column-gap:12px; }
    .option-icon { width:44px; height:44px; object-fit:contain; filter:drop-shadow(0 4px 7px #000); }
    .option-body { min-width:0; display:grid; gap:4px; }
    .option .title { color:#f0dfbb; }.option .description{color:var(--muted);font-size:13px;line-height:1.35}.option.error{border-color:rgba(202,111,103,.65)}.option.success{border-color:rgba(111,172,130,.65)}.option.warning{border-color:rgba(210,165,82,.65)}
    .metadata { display:flex; flex-wrap:wrap; gap:6px 12px; margin-top:4px; color:#c1b69e; font-size:12px; }.metadata b{color:var(--gold);font-weight:normal}
    .progress-track { height:10px; margin-top:22px; overflow:hidden; border:1px solid #4d473c; border-radius:999px; background:#101217; }
    #progress-fill { height:100%; width:0; background:linear-gradient(90deg,#846a35,var(--gold)); transition:width .08s linear; }
    #progress-time { margin-top:9px; color:var(--muted); text-align:right; font-variant-numeric:tabular-nums; }
    @keyframes arrive { from{opacity:0;transform:translateX(18px)} to{opacity:1;transform:none} } @keyframes leave{to{opacity:0;transform:translateX(18px)}}
  </style>
</head>
<body>
  <div id="toasts" aria-live="polite"></div>
  <div id="overlay"><section class="panel" id="panel" role="dialog" aria-modal="true"></section></div>
  <script>
    const toasts=document.querySelector("#toasts"),overlay=document.querySelector("#overlay"),panel=document.querySelector("#panel");
    let current=null,progressFrame=0,toastCount=0;
    const send=(name,payload={})=>{try{callEvent(name,JSON.stringify(payload))}catch(_){}};
    const node=(tag,cls,text)=>{const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=String(text);return el};
    const add=(parent,...children)=>{for(const child of children)if(child)parent.appendChild(child);return parent};
    function heading(title,content){const eyebrow=node("div","eyebrow","HMP Foundation");const h=node("h1","",title);const p=content?node("p","content",content):null;add(panel,eyebrow,h,p)}
    function actions(cancelLabel,confirmLabel,onConfirm,canCancel=true){const row=node("div","actions");if(canCancel){const cancel=node("button","",cancelLabel||"Cancel");cancel.onclick=()=>finish(current?.type==="alert"?"cancel":current?.type==="progress"?false:null);row.appendChild(cancel)}if(confirmLabel){const confirm=node("button","primary",confirmLabel);confirm.onclick=onConfirm;row.appendChild(confirm);setTimeout(()=>confirm.focus(),0)}panel.appendChild(row)}
    function finish(result){if(!current)return;const id=current.id;current=null;cancelAnimationFrame(progressFrame);progressFrame=0;overlay.classList.remove("open");panel.replaceChildren();send("response",{id,result})}
    function renderAlert(payload){heading(payload.title,payload.content);actions(payload.cancelLabel,payload.confirmLabel,()=>finish("confirm"),payload.cancel!==false)}
    function fieldControl(field){let input;if(field.type==="textarea")input=node("textarea");else if(field.type==="select"){input=node("select");for(const option of field.options||[]){const item=node("option","",option.label);item.value=option.value;input.appendChild(item)}}else{input=node("input");input.type=field.type==="number"?"number":field.type==="checkbox"?"checkbox":field.type==="password"?"password":"text"}input.name=field.name;if(field.placeholder)input.placeholder=field.placeholder;if(field.required)input.required=true;if(field.min!==undefined)input.min=String(field.min);if(field.max!==undefined)input.max=String(field.max);if(field.type==="checkbox")input.checked=field.default===true;else if(field.default!==undefined)input.value=String(field.default);return input}
    function renderInput(payload){heading(payload.title);const form=node("form","fields");for(const field of payload.fields||[]){const label=node("label",field.type==="checkbox"?"field check":"field");const control=fieldControl(field);if(field.type==="checkbox")add(label,control,node("span","",field.label));else add(label,node("span","",field.label),field.description?node("span","hint",field.description):null,control);form.appendChild(label)}panel.appendChild(form);const submit=()=>{if(!form.reportValidity())return;const result={};for(const field of payload.fields||[]){const control=form.elements.namedItem(field.name);result[field.name]=field.type==="checkbox"?control.checked:field.type==="number"?Number(control.value):control.value}finish(result)};form.onsubmit=e=>{e.preventDefault();submit()};actions(payload.cancelLabel,payload.submitLabel,submit,payload.allowCancel!==false)}
    function renderContext(payload){heading(payload.title,payload.description);const list=node("div","options");for(const option of payload.options||[]){const button=node("button",`option ${option.tone||""} ${option.icon?"has-icon":""}`);button.disabled=option.disabled===true;const body=node("span","option-body");add(body,node("span","title",option.title),option.description?node("span","description",option.description):null);if(option.metadata?.length){const meta=node("span","metadata");for(const item of option.metadata){const part=node("span");add(part,node("b","",`${item.label}: `),document.createTextNode(item.value));meta.appendChild(part)}body.appendChild(meta)}if(option.icon){const image=node("img","option-icon");image.src=option.icon;image.alt="";image.onerror=()=>image.remove();button.appendChild(image)}button.appendChild(body);button.onclick=()=>finish(option.id);list.appendChild(button)}panel.appendChild(list);actions(payload.cancelLabel,null,null,payload.canClose!==false)}
    function renderProgress(payload){heading("Please wait",payload.label);const track=node("div","progress-track"),fill=node("div");fill.id="progress-fill";track.appendChild(fill);const time=node("div","progress-time");panel.append(track,time);const began=performance.now();const tick=now=>{const elapsed=Math.max(0,now-began),ratio=Math.min(1,elapsed/payload.duration);fill.style.width=`${ratio*100}%`;time.textContent=`${Math.ceil(Math.max(0,payload.duration-elapsed)/1000)}s`;if(ratio>=1)finish(true);else progressFrame=requestAnimationFrame(tick)};progressFrame=requestAnimationFrame(tick);actions(payload.cancelLabel,null,null,payload.canCancel===true)}
    function renderRequest(request){if(!request?.id||current)return;current=request;panel.replaceChildren();overlay.classList.add("open");if(request.type==="alert")renderAlert(request.payload);else if(request.type==="input")renderInput(request.payload);else if(request.type==="context")renderContext(request.payload);else if(request.type==="progress")renderProgress(request.payload)}
    function notify(payload){const toast=node("article",`toast ${payload.tone||"inform"}`);if(payload.title)toast.appendChild(node("strong","",payload.title));toast.appendChild(node("p","",payload.description));toasts.appendChild(toast);toastCount++;setTimeout(()=>{toast.classList.add("leave");setTimeout(()=>{toast.remove();toastCount--;if(!toastCount)send("idle")},190)},payload.duration||4500)}
    window.addEventListener("request",event=>renderRequest(event.detail));window.addEventListener("notify",event=>notify(event.detail||{}));window.addEventListener("clear",()=>{if(current){cancelAnimationFrame(progressFrame);current=null}overlay.classList.remove("open");panel.replaceChildren()});
    window.addEventListener("keydown",event=>{if(event.key!=="Escape"||!current)return;const p=current.payload||{};const allowed=current.type==="alert"?p.cancel!==false:current.type==="input"?p.allowCancel!==false:current.type==="context"?p.canClose!==false:current.type==="progress"?p.canCancel===true:false;if(allowed){event.preventDefault();finish(current.type==="alert"?"cancel":current.type==="progress"?false:null)}});
    const demo=new URLSearchParams(location.search).get("dev");
    if(demo==="alert")renderRequest({id:"dev",type:"alert",payload:{title:"Confirm your choice",content:"This is the shared HMP alert surface. It keeps domain screens independent while giving every resource the same interaction language.",confirmLabel:"Confirm",cancelLabel:"Go back",cancel:true}});
    else if(demo==="input")renderRequest({id:"dev",type:"input",payload:{title:"Register an owl delivery",submitLabel:"Save delivery",cancelLabel:"Cancel",allowCancel:true,fields:[{name:"recipient",label:"Recipient",type:"text",placeholder:"Witch or wizard",required:true,description:"The name shown on the parcel."},{name:"count",label:"Number of parcels",type:"number",default:1,min:1,max:12},{name:"urgent",label:"Priority delivery",type:"checkbox",default:true},{name:"notes",label:"Delivery notes",type:"textarea",placeholder:"Optional instructions"}]}});
    else if(demo==="context")renderRequest({id:"dev",type:"context",payload:{title:"Potion station",description:"Choose an action for the selected cauldron.",canClose:true,cancelLabel:"Close",options:[{id:"brew",title:"Brew Wiggenweld",icon:"http://resources/hmp-inventory/dist/icons/potion.svg",description:"Uses one Horklump Juice and Dittany Leaves.",tone:"success",metadata:[{label:"Time",value:"15 seconds"},{label:"Yield",value:"1 potion"}]},{id:"collect",title:"Collect ingredients",description:"Move finished ingredients to your inventory."},{id:"locked",title:"Advanced recipes",description:"Requires a higher potion skill.",disabled:true,tone:"warning"}]}});
    else if(demo==="progress")renderRequest({id:"dev",type:"progress",payload:{label:"Brewing Wiggenweld…",duration:15000,canCancel:true,cancelLabel:"Stop brewing"}});
    else if(demo==="notify"){notify({title:"Owl Post",description:"A new letter has arrived.",tone:"success",duration:30000});notify({description:"Your inventory is nearly full.",tone:"warning",duration:30000})}
    send("ready");
  </script>
</body>
</html>
